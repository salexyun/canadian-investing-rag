# app + vector DB, runnable with a single `docker compose up --build`.
#
# No self-hosted Postgres/Grafana here on purpose: monitoring/observability
# is Langfuse Cloud (external, managed, free tier) — see TODO.md and
# data/README.md for why. Self-hosting Langfuse's own stack would mean
# 6 more services (Postgres + ClickHouse + Redis + MinIO + web + worker,
# ~4 cores/16GB recommended) for a course-project traffic volume; the
# same reasoning that lets us call OpenAI's API instead of self-hosting
# an LLM applies here.

services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Overrides .env's QDRANT_URL. .env is shared with local (non-Docker)
      # dev, where Qdrant really is reachable at localhost:6333 -- but
      # inside this container "localhost" means the container itself, not
      # the vector-db service next to it. Compose applies `environment`
      # after `env_file`, so this wins for the containerized app only,
      # without having to fork .env into a docker-only copy.
      - QDRANT_URL=http://vector-db:6333
    depends_on:
      - vector-db
    volumes:
      - ./data:/app/data

  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
