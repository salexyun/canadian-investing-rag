# app + vector DB, runnable with a single `docker compose up --build`.
#
# No self-hosted Postgres/Grafana here on purpose: monitoring/observability
# is Langfuse Cloud (external, managed, free tier) — see README.md's
# Monitoring section for why. Self-hosting Langfuse's own stack would mean
# 6 more services (Postgres + ClickHouse + Redis + MinIO + web + worker,
# ~4 cores/16GB recommended) for this project's actual traffic volume; the
# same reasoning that lets us call OpenAI's API instead of self-hosting
# an LLM applies here.

services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Overrides .env's QDRANT_URL. .env is shared with local (non-Docker)
      # dev, where Qdrant really is reachable at localhost:6333 -- but
      # inside this container "localhost" means the container itself, not
      # the vector-db service next to it. Compose applies `environment`
      # after `env_file`, so this wins for the containerized app only,
      # without having to fork .env into a docker-only copy.
      - QDRANT_URL=http://vector-db:6333
    depends_on:
      - vector-db
    volumes:
      - ./data:/app/data

  vector-db:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Build-only: never `up`'d as a running container. Kestra's Docker
  # task runner (flows/ingestion.yml) launches its own sibling
  # containers from this image by tag -- this service definition exists
  # solely so `docker compose build ingestion` produces that image
  # under a predictable name. Separate from `app`'s image because it
  # additionally bundles a Chromium binary (ingestion/Dockerfile) for
  # the CRA/CIRO/AMF fetch path -- the serving app never needs that,
  # and baking it in there would undo the image-size work in `app`.
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: canadian-investing-rag-ingestion:latest
    profiles: ["build-only"]

  # Orchestrates the ingestion pipeline (flows/ingestion.yml) instead of
  # running fetch/chunk/load by hand. Standalone mode (`server local`)
  # with its embedded H2 database -- no separate Postgres service, unlike
  # Kestra's own docker-compose docs default, for the same reason
  # Langfuse/Grafana aren't self-hosted here: right-sized for a
  # this project's actual traffic/data volume, not production HA. UI/API at
  # http://localhost:8080.
  kestra:
    image: kestra/kestra:v1.3.40
    # Starts the server, waits until its API answers, then registers
    # flows/ingestion.yml with the same `flow namespace update` CLI call
    # that used to be a manual README step -- so `docker compose up -d
    # kestra` alone gives a ready-to-run flow. Kestra's own "load flows
    # from a folder" options were tried first and don't work on this
    # version: `server local --flow-path` runs before plugins are
    # registered (rejects shell.Commands as an unknown type), and the
    # micronaut.io.watch file sync fails flow validation on a missing
    # tenantId. Re-runs on every start, so edits to flows/ are picked up
    # by `docker compose restart kestra`. The trap forwards `docker stop`
    # to the server, since sh (not Kestra) is PID 1 here.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /app/kestra server local --no-tutorials &
        pid=$$!
        trap 'kill $$pid; wait $$pid' TERM INT
        until curl -fs -o /dev/null http://localhost:8080/api/v1/configs; do sleep 2; done
        /app/kestra flow namespace update canadian-investing-rag /app/flows \
          --server http://localhost:8080 --user "$$KESTRA_USER:$$KESTRA_PASSWORD"
        wait $$pid
    environment:
      # Pre-seeds the UI/API login, replacing Kestra's first-run "create
      # admin account" wizard. Local-only (port 8080 on this machine);
      # set KESTRA_USER/KESTRA_PASSWORD in .env to use your own. Kestra
      # requires an email-shaped username and a password with 8+ chars,
      # an uppercase letter and a digit.
      KESTRA_USER: ${KESTRA_USER:-admin@localhost.dev}
      KESTRA_PASSWORD: ${KESTRA_PASSWORD:-Kestra123}
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USER:-admin@localhost.dev}
              password: ${KESTRA_PASSWORD:-Kestra123}
      # Surfaced to flows as {{ envs.host_repo_root }} -- the default for
      # flows/ingestion.yml's repo_root input. Compose resolves ${PWD}
      # on the host, i.e. the directory you ran `docker compose` from,
      # which is this repo when following the README.
      ENV_HOST_REPO_ROOT: ${PWD}
    user: root # matches Kestra's own single-container docs -- the image's
    # default non-root user can't write kestra_db's embedded H2 file
    # (confirmed: omitting this produced a real AccessDeniedException
    # on /app/data/database.mv.db at startup, not a hypothetical concern)
    ports:
      - "8080:8080"
    volumes:
      - kestra_storage:/app/storage
      - kestra_db:/app/data
      # Docker-outside-of-Docker: lets Kestra launch the `ingestion`
      # image as sibling containers on the host's Docker daemon rather
      # than needing Docker-in-Docker. This is why flows/ingestion.yml's
      # bind-mount paths must be host paths, not paths inside this
      # container.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./flows:/app/flows

volumes:
  qdrant_storage:
  kestra_storage:
  kestra_db:
